version: '3.8'

services:
  # --- Database Service ---
  postgres:
    image: postgres:16-alpine
    container_name: trove_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=investment_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Spring Boot App Service ---
  investment-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investment_platform_trove
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/investment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_FLYWAY_ENABLED=true
      - SPRING_FLYWAY_REPAIR_ON_MIGRATE=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: